# =============================================================================
# AEGIS-CREW · rules.yaml · Motor clínico del Gemelo Bio-Digital
# Versión 2026.11.2 — añade bloque mental reforzado (NASA-STD-3001 V1 §6004)
# Semántica: direction=high → valor >= umbral; direction=low → valor <= umbral.
# nominal_ref = valor donde la severidad continua es 0.0.
# =============================================================================
meta:
  schema: "aegis-crew/rules/1.0"
  rules_version: "2026.11.2"
  owner: "Bio-Digital Twin & Clinical Engine"
  normative_base:
    - "NASA-STD-3001 Vol.1 (Crew Health) Rev B/C — §3003, §3004, §4011, §6001-6004"
    - "NASA-STD-3001 Vol.2 (Human Factors, Habitability & Environmental Health) Rev C"
    - "OCHMO-TB-016 Rev A - Behavioral Health and Performance (technical brief)"
    - "HRP Evidence Report: Risk of Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders (2025-02-10)"
    - "AHRQ SHARE Approach (toma de decisiones compartidas)"
  evidence_levels:
    standard_numeric: "El límite numérico figura en NASA-STD-3001 o documento oficial NASA que lo cita."
    standard_qualitative: "La norma exige capacidad/vigilancia pero no fija número; umbral de ingeniería clínica."
    clinical_framework: "Umbral de instrumento clínico validado en tierra; NASA aún no valida umbrales en vuelo (HRP Gap BMed-102)."
    engineering_placeholder: "Valor provisional: verificar contra la tabla vigente de la norma antes de uso operativo."
  disclaimer: "Soporte a la decisión; no sustituye al CMO/flight surgeon ni al psicólogo/psiquiatra de operaciones (BHP Op Psy)."

engine:
  domain_weights: {vital: 0.30, environment: 0.20, mental: 0.50}
  severity_anchors: [0.30, 0.60, 0.90]
  blend_weighted_mean: 0.6
  blend_worst_case: 0.4
  hysteresis_margin_fraction: 0.15
  baseline_min_samples: 10
  baseline_max_samples: 300
  trend_window_days: 14
  trend_min_points: 5
  trend_p_value: 0.05
  trend_max_bump: 0.10
  domain_defaults:
    vital:       {tau_hours: 0.25, confirm_up: 3, confirm_down: 5, stale_after_hours: 1}
    environment: {tau_hours: 0.5,  confirm_up: 3, confirm_down: 5, stale_after_hours: 1}
    mental:      {tau_hours: 24,   confirm_up: 2, confirm_down: 3, stale_after_hours: 36}

rules:
  # ------------------------------- SIGNOS VITALES ----------------------------
  - id: V-SPO2
    domain: vital
    variable: spo2_pct
    direction: low
    unit: "%"
    nominal_ref: 97
    thresholds: {caution: 95, warning: 92, critical: 88}
    weight: 1.0
    bypass_confirm: 2
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §3003/§3004 (monitoreo e intervención in-mission); V1 §4011; hipoxia en OCHMO-TB-016"
    rationale: "La hipoxia degrada cognición y ánimo. Dos lecturas críticas consecutivas saltan el filtro."
    countermeasure_tags: [vitals, environment_air, clinician]

  - id: V-HR-REST-HIGH
    domain: vital
    variable: hr_rest_bpm
    direction: high
    unit: "lpm"
    nominal_ref: 70
    thresholds: {caution: 90, warning: 100, critical: 120}
    weight: 0.6
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §3003; HRP Evidence Report (eje HPA/estrés agudo)"
    rationale: "Taquicardia en reposo sostenida: estrés agudo, deshidratación o arritmia."
    countermeasure_tags: [vitals, stress, rest, clinician]

  - id: V-HR-REST-LOW
    domain: vital
    variable: hr_rest_bpm
    direction: low
    unit: "lpm"
    nominal_ref: 62
    thresholds: {caution: 50, warning: 45, critical: 40}
    weight: 0.5
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §3003/§3004"
    rationale: "Bradicardia marcada: condicionamiento o síntoma; la línea base personal evita falsos positivos."
    countermeasure_tags: [vitals, clinician]

  - id: V-CORE-TEMP
    domain: vital
    variable: core_temp_c
    direction: high
    unit: "°C"
    nominal_ref: 36.8
    thresholds: {caution: 37.8, warning: 38.5, critical: 39.5}
    weight: 0.7
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §3004; V2 §6012 (límites ambientales)"
    rationale: "Fiebre/hipertermia: infección, fallo térmico o sobreesfuerzo en EVA."
    countermeasure_tags: [vitals, rest, clinician]

  # ------------------------------- AMBIENTE ----------------------------------
  - id: E-CO2
    domain: environment
    variable: ppco2_mmhg
    direction: high
    unit: "mmHg"
    nominal_ref: 2.3
    thresholds: {caution: 3.0, warning: 4.5, critical: 7.6}
    weight: 1.0
    bypass_confirm: 2
    evidence_level: engineering_placeholder
    citation: "NASA-STD-3001 V2 §6022; HRP Evidence Report (ISS 0.3-0.5 %)"
    rationale: "CO2 elevado se asocia a cefalea y niebla mental; 7.6 mmHg ≈ 1 %."
    countermeasure_tags: [environment_air, vitals, cognition]

  - id: E-RAD-CNS-30D
    domain: environment
    variable: cns_dose_30d_mgy
    direction: high
    unit: "mGy"
    nominal_ref: 50
    thresholds: {caution: 250, warning: 400, critical: 500}
    weight: 0.9
    evidence_level: standard_numeric
    citation: "NASA-STD-3001 V1 (CNS 500 mGy/30 d hipocampo); V2 §6097; §6099"
    rationale: "Marcador provisional de límite CNS; se escala al 50 % y 80 % para actuar antes de una SPE."
    countermeasure_tags: [radiation, clinician]

  - id: E-RAD-CNS-1Y
    domain: environment
    variable: cns_dose_1y_mgy
    direction: high
    unit: "mGy"
    nominal_ref: 100
    thresholds: {caution: 500, warning: 800, critical: 1000}
    weight: 0.7
    evidence_level: standard_numeric
    citation: "NASA-STD-3001 V1 (CNS 1 año = 1000 mGy); V2 §6095/§6097"
    rationale: "Salvaguarda ante SPE en tránsito a Marte."
    countermeasure_tags: [radiation, clinician]

  - id: E-NOISE-SLEEP
    domain: environment
    variable: noise_sleep_nc
    direction: high
    unit: "NC"
    nominal_ref: 30
    thresholds: {caution: 36, warning: 40.1, critical: 50.1}
    weight: 0.4
    evidence_level: standard_numeric
    citation: "NASA-STD-3001 V2 §6079 (NC-40 >30 d); §6078 (NC-50 áreas trabajo); §6082; Caddick 2018"
    rationale: "El ruido es causa documentada de sueño corto en ISS; >40 NC viola V2 §6079."
    countermeasure_tags: [noise, sleep]

  # ------------------------- SALUD MENTAL / CONDUCTUAL -----------------------
  - id: M-STRESS
    domain: mental
    variable: stress_vas_0_10
    direction: high
    unit: "VAS 0-10"
    nominal_ref: 2
    thresholds: {caution: 5, warning: 7, critical: 9}
    weight: 0.8
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §3003, §6004 (programa soporte psicológico), §4011; HRP Gap BMed-102; Dinges 2014"
    rationale: "El estrés autorreportado sube ~50 % en 6 meses y se acelera; se vigila tendencia."
    countermeasure_tags: [stress, mood, anxiety, workload, rest]

  - id: M-MENTAL-FATIGUE
    domain: mental
    variable: mental_fatigue_vas
    direction: high
    unit: "VAS 0-10"
    nominal_ref: 2
    thresholds: {caution: 5, warning: 7, critical: 9}
    weight: 0.8
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §6001 (gestión fatiga/circadiano); §4011; HRP (astenia, Kanas 1991)"
    rationale: "Fatiga es de los síntomas más reportados; forma subclínica de astenia."
    countermeasure_tags: [fatigue, rest, sleep, workload]

  - id: M-PHQ2
    domain: mental
    variable: phq2_score
    direction: high
    unit: "puntos 0-6"
    nominal_ref: 0
    thresholds: {caution: 2, warning: 3, critical: 5}
    weight: 1.0
    evidence_level: clinical_framework
    citation: "PHQ-2 (Kroenke 2003, corte ≥3); NASA-STD-3001 V1 §4011 y §6004; HRP (29 % síntomas depresivos Shuttle-Mir)"
    rationale: "Subnotificación por miedo al estatus de vuelo; se actúa desde 2."
    countermeasure_tags: [mood, anxiety, stress, social, clinician_support]

  - id: M-GAD2
    domain: mental
    variable: gad2_score
    direction: high
    unit: "puntos 0-6"
    nominal_ref: 0
    thresholds: {caution: 2, warning: 3, critical: 5}
    weight: 1.0
    evidence_level: clinical_framework
    citation: "GAD-2 (Kroenke 2007, corte ≥3); NASA-STD-3001 V1 §4011 y §6004; HRP (ansiedad frecuente en Shuttle)"
    rationale: "Ansiedad subclínica es el evento conductual más frecuente; Marte (sin evacuación) añade carga."
    countermeasure_tags: [anxiety, stress, mood, clinician_support]

  - id: M-SELFHARM-ITEM
    domain: mental
    variable: phq9_item9
    direction: high
    unit: "ítem 0-3"
    nominal_ref: 0
    thresholds: {caution: 0.5, warning: 0.75, critical: 1.0}
    weight: 1.0
    tau_hours: 0
    confirm_up: 1
    bypass_confirm: 1
    latch_until_ack: true
    safety_override: true
    evidence_level: clinical_framework
    citation: "PHQ-9 ítem 9; NASA-STD-3001 V1 §6004; §3004; OCHMO-TB-016 (precedente escotillas con candado)"
    rationale: "Cualquier respuesta >0 es evento de seguridad: sin suavizado, sin histéresis, escalada obligatoria."
    countermeasure_tags: [safety]

  - id: M-TLX
    domain: mental
    variable: tlx_weighted_0_100
    direction: high
    unit: "NASA-TLX 0-100"
    nominal_ref: 35
    thresholds: {caution: 55, warning: 70, critical: 85}
    weight: 0.6
    evidence_level: engineering_placeholder
    citation: "NASA-TLX (Hart & Staveland); NASA-STD-3001 V2 §5007"
    rationale: "El TLX no tiene corte normativo; se usa para detectar sobrecarga."
    countermeasure_tags: [workload, stress, fatigue]

  - id: M-BEDFORD
    domain: mental
    variable: bedford_workload_1_10
    direction: high
    unit: "Bedford 1-10"
    nominal_ref: 3
    thresholds: {caution: 4, warning: 7, critical: 9}
    weight: 0.5
    confirm_up: 1
    evidence_level: standard_numeric
    citation: "NASA-STD-3001 V2 §5007 (Bedford ≤3 nominal y ≤6 no nominal)"
    rationale: "4-6 viola requisito en tareas nominales; 7-9 supera límite no nominal."
    countermeasure_tags: [workload, stress]

  - id: M-SLEEP
    domain: mental
    variable: sleep_hours
    direction: low
    unit: "h/noche"
    nominal_ref: 7.5
    thresholds: {caution: 6.0, warning: 5.0, critical: 4.0}
    weight: 0.9
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §6001, V2 §7070; Barger 2014a; Jones 2022a"
    rationale: "ISS duerme ~6-6.5 h pese a 8.5 h programadas; <6 h degrada vigilancia y eleva estrés."
    countermeasure_tags: [sleep, fatigue, noise, rest]

  - id: M-COGNITION
    domain: mental
    variable: cognitive_z
    direction: low
    unit: "z vs. basal"
    nominal_ref: 0
    thresholds: {caution: -1.0, warning: -1.5, critical: -2.5}
    weight: 0.9
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §4011; Dev 2024 (z ≤ -1.5 vs. basal preflight)"
    rationale: "Comparación contra basal preflight, no contra población."
    countermeasure_tags: [cognition, fatigue, sleep, rest, environment_air]

  - id: M-PPC-GAP
    domain: mental
    variable: days_since_ppc
    direction: high
    unit: "días"
    nominal_ref: 7
    thresholds: {caution: 15, warning: 21, critical: 42}
    weight: 0.4
    tau_hours: 0
    confirm_up: 1
    evidence_level: standard_qualitative
    citation: "NASA-STD-3001 V1 §6002 (PMC programadas) y §6004; HRP (PPC cada ~2 semanas)"
    rationale: "Regla de proceso: PPC cada 2 semanas es el principal monitoreo conductual."
    countermeasure_tags: [clinician_support, social]

  # --------- NUEVAS REGLAS MENTALES (refuerzo §6004 / OCHMO-TB-016) ----------
  - id: M-SOCIAL-ISOLATION
    domain: mental
    variable: social_contact_days
    direction: high
    unit: "días sin contacto significativo"
    nominal_ref: 1
    thresholds: {caution: 3, warning: 5, critical: 7}
    weight: 0.7
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §6004 (soporte psicológico); OCHMO-TB-016 (aislamiento/confinamiento); Stuster 2016"
    rationale: "El aislamiento prolongado es factor de riesgo conductual documentado en análogos e ISS; se cuenta desde el último contacto significativo (familia, amigo o PPC)."
    countermeasure_tags: [social, mood, stress, clinician_support]

  - id: M-ANGER-IRRITABILITY
    domain: mental
    variable: irritability_vas
    direction: high
    unit: "VAS 0-10"
    nominal_ref: 1
    thresholds: {caution: 4, warning: 6, critical: 8}
    weight: 0.6
    evidence_level: clinical_framework
    citation: "OCHMO-TB-016 (conflicto interpersonal tripulación-tierra); NASA-STD-3001 V1 §6004; Kanas 1991"
    rationale: "La irritabilidad y el conflicto interpersonal son predictores de disfunción de tripulación en misiones largas (Shuttle-Mir, Mars-500)."
    countermeasure_tags: [mood, stress, social, rest]

  - id: M-MOTIVATION
    domain: mental
    variable: motivation_vas
    direction: low
    unit: "VAS 0-10"
    nominal_ref: 8
    thresholds: {caution: 5, warning: 3, critical: 1}
    weight: 0.6
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §6004; HRP Evidence Report (desmoralización, tercer cuarto); Stuster 2016"
    rationale: "La caída de motivación marca el 'third-quarter phenomenon' y precede a síntomas depresivos."
    countermeasure_tags: [mood, workload, social, rest]

  - id: M-APPETITE
    domain: mental
    variable: appetite_vas
    direction: low
    unit: "VAS 0-10"
    nominal_ref: 7
    thresholds: {caution: 4, warning: 2, critical: 1}
    weight: 0.5
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §3004/§6004; V2 §7000 (alimentación); HRP"
    rationale: "La pérdida de apetito es síntoma somático de depresión/estrés y predictor de ingesta calórica insuficiente en vuelo."
    countermeasure_tags: [mood, sleep, clinician]

countermeasures:
  - {id: CM-EXERCISE-INTERVAL, label: "Ejercicio aeróbico por intervalos guiado", tags: [stress, mood, anxiety, sleep, fatigue, cognition], effort: media, requires_clinician: false,
     benefits: "Reduce síntomas de ánimo/ansiedad subclínicos y estabiliza el ánimo; mejora BDNF.",
     harms_limits: "Consume tiempo de agenda; riesgo musculoesquelético.",
     evidence: "Abeln 2015; Salmon 2001; Samendinger 2019"}
  - {id: CM-SLEEP-DLS, label: "Ventana de sueño protegida + iluminación dinámica", tags: [sleep, fatigue, cognition, mood], effort: baja, requires_clinician: false,
     benefits: "Mejora arrastre circadiano y reduce lapsos de atención.",
     harms_limits: "Requiere cambios de agenda; no corrige ruido ambiental.",
     evidence: "Grant 2024; Rahman 2022; V2 §8055"}
  - {id: CM-QUIET-SLEEP, label: "Reducir ruido: tapones, pausar equipos, reubicar tareas", tags: [noise, sleep], effort: baja, requires_clinician: false,
     benefits: "Ataca causa directa de sueño corto; cumple V2 §6079/§6082.",
     harms_limits: "Tapones no sustituyen el límite normativo.",
     evidence: "NASA-STD-3001 V2 §6079/§6082; Caddick 2018"}
  - {id: CM-REST-RECOVERY, label: "Descanso protegido (turno liviano / siesta controlada)", tags: [rest, fatigue, cognition, vitals], effort: baja, requires_clinician: false,
     benefits: "Recupera vigilancia y baja carga fisiológica a corto plazo.",
     harms_limits: "Cede tiempo de trabajo; mal uso puede desalinear circadiano.",
     evidence: "NASA-STD-3001 V1 §6001; Lim & Dinges 2010"}
  - {id: CM-WORKLOAD-REBALANCE, label: "Rebalancear carga y dar autonomía sobre agenda", tags: [workload, stress, fatigue], effort: media, requires_clinician: false,
     benefits: "Autonomía y trabajo significativo protegen contra monotonía y sobrecarga.",
     harms_limits: "Requiere acuerdo de tripulación; puede retrasar tareas.",
     evidence: "Kanas & Manzey 2008; Stuster 2016; V2 §5007"}
  - {id: CM-CBT-AUTONOMO, label: "Módulos autónomos de TCC / solución de problemas (VSS, This Way Up)", tags: [mood, anxiety, stress], effort: media, requires_clinician: false,
     benefits: "Funciona sin comunicación en tiempo real; PST redujo depresión leve en 3 sesiones.",
     harms_limits: "Aceptabilidad mixta en análogo (HI-SEAS); no sustituye evaluación clínica si empeora.",
     evidence: "Sandoval 2017; Rose 2018; Anderson 2016"}
  - {id: CM-SMART-OP, label: "Entrenamiento de manejo de estrés SMART-OP", tags: [stress, anxiety], effort: media, requires_clinician: false,
     benefits: "Reduce estrés percibido y aumenta sensación de control.",
     harms_limits: "Efecto modesto; requiere tiempo estructurado.",
     evidence: "Rose 2013; Rose 2019"}
  - {id: CM-MINDFULNESS, label: "Mindfulness (sesiones breves guiadas)", tags: [stress, anxiety, mood], effort: baja, requires_clinician: false,
     benefits: "Eficaz para estrés y moderadamente para ansiedad y ánimo.",
     harms_limits: "Efecto pequeño sobre burnout.",
     evidence: "Khoury 2015; Pagnini 2024"}
  - {id: CM-CROPS-NATURE, label: "Cuidado de cultivos / ventana virtual de naturaleza", tags: [mood, stress, social], effort: baja, requires_clinician: false,
     benefits: "Actividad significativa y conexión con la Tierra.",
     harms_limits: "Si el cultivo falla puede ser contraproducente.",
     evidence: "Kelly 2017; Veggie; Kearney 2013"}
  - {id: CM-SOCIAL-MEAL, label: "Comida o evento social de tripulación", tags: [mood, social, stress], effort: baja, requires_clinician: false,
     benefits: "La comida compartida es el mecanismo de cohesión más citado en ISS.",
     harms_limits: "Puede ser poco deseable si el conflicto es interpersonal.",
     evidence: "Stuster 2016; Douglas 2016"}
  - {id: CM-ASYNC-FAMILY, label: "Mensaje/video asincrónico con familia", tags: [mood, social, stress, clinician_support], effort: baja, requires_clinician: false,
     benefits: "Mantiene vínculo pese al retardo; reduce estrés vespertino.",
     harms_limits: "No es tiempo real; noticias difíciles pueden aumentar malestar.",
     evidence: "Bell 2025; Ott 2016 (ANSIBLE); V2 §10093"}
  - {id: CM-VITALS-RECHECK, label: "Repetir medición y verificar sensor", tags: [vitals], effort: baja, requires_clinician: false,
     benefits: "Descarta artefacto antes de escalar.",
     harms_limits: "Retrasa 5-10 min; no aplica si hay síntomas.",
     evidence: "NASA-STD-3001 V1 §3003"}
  - {id: CM-ENV-AIR, label: "Acción ambiental: ventilación, cambio de módulo, purga CO2", tags: [environment_air, vitals, cognition], effort: media, requires_clinician: false,
     benefits: "Corrige la causa y no solo el síntoma.",
     harms_limits: "Puede interrumpir tareas; requiere procedimiento aprobado.",
     evidence: "NASA-STD-3001 V2 §6017/§6022"}
  - {id: CM-RAD-SHELTER, label: "Refugio de radiación / reprogramar EVA (ALARA)", tags: [radiation], effort: media, requires_clinician: false,
     benefits: "Reduce dosis acumulada hacia CNS.",
     harms_limits: "Afecta EVA; confinamiento adicional empeora aislamiento.",
     evidence: "NASA-STD-3001 V2 §6097/§6099"}
  - {id: CM-PPC-ASYNC, label: "PPC asincrónica con psicólogo/psiquiatra de tierra", tags: [mood, anxiety, stress, clinician_support, clinician, safety], effort: media, requires_clinician: true,
     benefits: "Evaluación experta y espacio confidencial; monitoreo conductual principal en ISS.",
     harms_limits: "Retardo de comunicación; temor a estatus de vuelo frena sinceridad.",
     evidence: "NASA-STD-3001 V1 §6002/§6004; HRP"}
  - {id: CM-PMC-CMO, label: "Consulta médica privada (PMC) con CMO / flight surgeon", tags: [vitals, radiation, clinician, safety], effort: media, requires_clinician: true,
     benefits: "Diagnóstico diferencial y acceso al botiquín/protocolo médico.",
     harms_limits: "Ocupa tiempo del CMO; puede requerir apoyo asincrónico.",
     evidence: "NASA-STD-3001 V1 §3004/§6002"}
  - {id: CM-PHARMA, label: "Farmacoterapia (solo con autorización clínica)", tags: [anxiety, mood, sleep, clinician], effort: baja, requires_clinician: true,
     benefits: "Alivio sintomático cuando lo conductual no basta.",
     harms_limits: "62.9 % de fármacos ISS pueden reducir alerta; hipnóticos limitan respuesta a alarmas.",
     evidence: "Roma 2021; Friedman & Bui 2017; Wotring 2015"}
  - {id: CM-SAFETY-PROTOCOL, label: "Protocolo de seguridad: acompañamiento + contacto clínico urgente", tags: [safety], effort: alta, requires_clinician: true,
     benefits: "Protege a la persona y a la tripulación mientras se evalúa.",
     harms_limits: "Carga operativa alta; trato respetuoso para no aumentar aislamiento.",
     evidence: "NASA-STD-3001 V1 §6004; OCHMO-TB-016"}

share:
  follow_up_hours: {CAUTION: 48, WARNING: 24, CRITICAL: 6}
  min_improvement: 0.10
  prompts:
    seek:
      - "Resuma el problema en lenguaje simple y cite qué regla se activó."
      - "Informe que existen opciones y que su participación es importante; puede decidir no participar o delegar."
      - "Ofrezca incluir a un compañero de tripulación o apoyo familiar si lo desea."
    help:
      - "Compare beneficios y daños de cada opción, incluida la observación activa."
      - "Exprese los números simple y explique lo que se sabe y lo que no."
      - "Verifique comprensión: pida que explique las opciones con sus palabras (teach-back)."
    assess:
      - "Pregunte qué es lo más importante para usted ahora y reconozca esos valores."
    reach:
      - "Pregunte si está listo para decidir o si necesita más tiempo o información."
      - "Confirme la decisión y programe seguimiento; delegar la decisión también es válido."
    evaluate:
      - "En el seguimiento compare el estado con la línea de partida; si no mejora, vuelva a revisar opciones."
  assess_questions:
    - "¿Qué le importa más hoy: dormir, privacidad, contacto con la familia, rendimiento en tareas críticas?"
    - "¿Qué ha ayudado antes en situaciones parecidas y qué no?"
    - "¿Qué efectos secundarios o costos de agenda no está dispuesto a aceptar?"