# =============================================================================
# MEDICJAB · rules.yaml · Clinical engine of the Bio-Digital Twin
# Version 2026.11.2 — adds reinforced mental block (NASA-STD-3001 V1 §6004)
# Semantics: direction=high → value >= threshold; direction=low → value <= threshold.
# nominal_ref = value at which continuous severity is 0.0.
# =============================================================================
meta:
  schema: "aegis-crew/rules/1.0"
  rules_version: "2026.11.2"
  owner: "Bio-Digital Twin & Clinical Engine"
  normative_base:
    - "NASA-STD-3001 Vol.1 (Crew Health) Rev B/C — §3003, §3004, §4011, §6001-6004"
    - "NASA-STD-3001 Vol.2 (Human Factors, Habitability & Environmental Health) Rev C"
    - "OCHMO-TB-016 Rev A - Behavioral Health and Performance (technical brief)"
    - "HRP Evidence Report: Risk of Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders (2025-02-10)"
    - "AHRQ SHARE Approach (shared decision-making)"
  evidence_levels:
    standard_numeric: "The numeric limit appears in NASA-STD-3001 or an official NASA document that cites it."
    standard_qualitative: "The standard requires capability/surveillance but sets no number; clinical engineering threshold."
    clinical_framework: "Threshold from a clinical instrument validated on the ground; NASA has not yet validated in-flight thresholds (HRP Gap BMed-102)."
    engineering_placeholder: "Provisional value: verify against the current table of the standard before operational use."
  disclaimer: "Decision support; does not replace the CMO/flight surgeon or the operational psychologist/psychiatrist (BHP Op Psy)."

engine:
  domain_weights: {vital: 0.30, environment: 0.20, mental: 0.50}
  severity_anchors: [0.30, 0.60, 0.90]
  blend_weighted_mean: 0.6
  blend_worst_case: 0.4
  hysteresis_margin_fraction: 0.15
  baseline_min_samples: 10
  baseline_max_samples: 300
  trend_window_days: 14
  trend_min_points: 5
  trend_p_value: 0.05
  trend_max_bump: 0.10
  domain_defaults:
    vital:       {tau_hours: 0.25, confirm_up: 3, confirm_down: 5, stale_after_hours: 1}
    environment: {tau_hours: 0.5,  confirm_up: 3, confirm_down: 5, stale_after_hours: 1}
    mental:      {tau_hours: 24,   confirm_up: 2, confirm_down: 3, stale_after_hours: 36}

rules:
  # ------------------------------- VITAL SIGNS -------------------------------
  - id: V-SPO2
    domain: vital
    variable: spo2_pct
    direction: low
    unit: "%"
    nominal_ref: 97
    thresholds: {caution: 95, warning: 92, critical: 88}
    weight: 1.0
    bypass_confirm: 2
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §3003/§3004 (in-mission monitoring and intervention); V1 §4011; hypoxia in OCHMO-TB-016"
    rationale: "Hypoxia degrades cognition and mood. Two consecutive critical readings bypass the filter."
    countermeasure_tags: [vitals, environment_air, clinician]

  - id: V-HR-REST-HIGH
    domain: vital
    variable: hr_rest_bpm
    direction: high
    unit: "bpm"
    nominal_ref: 70
    thresholds: {caution: 90, warning: 100, critical: 120}
    weight: 0.6
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §3003; HRP Evidence Report (HPA axis/acute stress)"
    rationale: "Sustained resting tachycardia: acute stress, dehydration or arrhythmia."
    countermeasure_tags: [vitals, stress, rest, clinician]

  - id: V-HR-REST-LOW
    domain: vital
    variable: hr_rest_bpm
    direction: low
    unit: "bpm"
    nominal_ref: 62
    thresholds: {caution: 50, warning: 45, critical: 40}
    weight: 0.5
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §3003/§3004"
    rationale: "Marked bradycardia: conditioning or symptom; the personal baseline avoids false positives."
    countermeasure_tags: [vitals, clinician]

  - id: V-CORE-TEMP
    domain: vital
    variable: core_temp_c
    direction: high
    unit: "°C"
    nominal_ref: 36.8
    thresholds: {caution: 37.8, warning: 38.5, critical: 39.5}
    weight: 0.7
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §3004; V2 §6012 (environmental limits)"
    rationale: "Fever/hyperthermia: infection, thermal failure or overexertion during EVA."
    countermeasure_tags: [vitals, rest, clinician]

  # ------------------------------- ENVIRONMENT -------------------------------
  - id: E-CO2
    domain: environment
    variable: ppco2_mmhg
    direction: high
    unit: "mmHg"
    nominal_ref: 2.3
    thresholds: {caution: 3.0, warning: 4.5, critical: 7.6}
    weight: 1.0
    bypass_confirm: 2
    evidence_level: engineering_placeholder
    citation: "NASA-STD-3001 V2 §6022; HRP Evidence Report (ISS 0.3-0.5 %)"
    rationale: "Elevated CO2 is associated with headache and mental fog; 7.6 mmHg ≈ 1 %."
    countermeasure_tags: [environment_air, vitals, cognition]

  - id: E-RAD-CNS-30D
    domain: environment
    variable: cns_dose_30d_mgy
    direction: high
    unit: "mGy"
    nominal_ref: 50
    thresholds: {caution: 250, warning: 400, critical: 500}
    weight: 0.9
    evidence_level: standard_numeric
    citation: "NASA-STD-3001 V1 (CNS 500 mGy/30 d hippocampus); V2 §6097; §6099"
    rationale: "Provisional CNS limit marker; scaled to 50 % and 80 % to act before an SPE."
    countermeasure_tags: [radiation, clinician]

  - id: E-RAD-CNS-1Y
    domain: environment
    variable: cns_dose_1y_mgy
    direction: high
    unit: "mGy"
    nominal_ref: 100
    thresholds: {caution: 500, warning: 800, critical: 1000}
    weight: 0.7
    evidence_level: standard_numeric
    citation: "NASA-STD-3001 V1 (CNS 1 year = 1000 mGy); V2 §6095/§6097"
    rationale: "Safeguard against SPE during transit to Mars."
    countermeasure_tags: [radiation, clinician]

  - id: E-NOISE-SLEEP
    domain: environment
    variable: noise_sleep_nc
    direction: high
    unit: "NC"
    nominal_ref: 30
    thresholds: {caution: 36, warning: 40.1, critical: 50.1}
    weight: 0.4
    evidence_level: standard_numeric
    citation: "NASA-STD-3001 V2 §6079 (NC-40 >30 d); §6078 (NC-50 work areas); §6082; Caddick 2018"
    rationale: "Noise is a documented cause of short sleep on the ISS; >40 NC violates V2 §6079."
    countermeasure_tags: [noise, sleep]

  # ------------------------- MENTAL / BEHAVIORAL HEALTH ----------------------
  - id: M-STRESS
    domain: mental
    variable: stress_vas_0_10
    direction: high
    unit: "VAS 0-10"
    nominal_ref: 2
    thresholds: {caution: 5, warning: 7, critical: 9}
    weight: 0.8
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §3003, §6004 (psychological support program), §4011; HRP Gap BMed-102; Dinges 2014"
    rationale: "Self-reported stress rises ~50 % over 6 months and accelerates; the trend is monitored."
    countermeasure_tags: [stress, mood, anxiety, workload, rest]

  - id: M-MENTAL-FATIGUE
    domain: mental
    variable: mental_fatigue_vas
    direction: high
    unit: "VAS 0-10"
    nominal_ref: 2
    thresholds: {caution: 5, warning: 7, critical: 9}
    weight: 0.8
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §6001 (fatigue/circadian management); §4011; HRP (asthenia, Kanas 1991)"
    rationale: "Fatigue is among the most reported symptoms; a subclinical form of asthenia."
    countermeasure_tags: [fatigue, rest, sleep, workload]

  - id: M-PHQ2
    domain: mental
    variable: phq2_score
    direction: high
    unit: "points 0-6"
    nominal_ref: 0
    thresholds: {caution: 2, warning: 3, critical: 5}
    weight: 1.0
    evidence_level: clinical_framework
    citation: "PHQ-2 (Kroenke 2003, cutoff ≥3); NASA-STD-3001 V1 §4011 and §6004; HRP (29 % depressive symptoms Shuttle-Mir)"
    rationale: "Under-reporting due to fear for flight status; action is taken from 2."
    countermeasure_tags: [mood, anxiety, stress, social, clinician_support]

  - id: M-GAD2
    domain: mental
    variable: gad2_score
    direction: high
    unit: "points 0-6"
    nominal_ref: 0
    thresholds: {caution: 2, warning: 3, critical: 5}
    weight: 1.0
    evidence_level: clinical_framework
    citation: "GAD-2 (Kroenke 2007, cutoff ≥3); NASA-STD-3001 V1 §4011 and §6004; HRP (frequent anxiety in Shuttle)"
    rationale: "Subclinical anxiety is the most frequent behavioral event; Mars (no evacuation) adds burden."
    countermeasure_tags: [anxiety, stress, mood, clinician_support]

  - id: M-SELFHARM-ITEM
    domain: mental
    variable: phq9_item9
    direction: high
    unit: "item 0-3"
    nominal_ref: 0
    thresholds: {caution: 0.5, warning: 0.75, critical: 1.0}
    weight: 1.0
    tau_hours: 0
    confirm_up: 1
    bypass_confirm: 1
    latch_until_ack: true
    safety_override: true
    evidence_level: clinical_framework
    citation: "PHQ-9 item 9; NASA-STD-3001 V1 §6004; §3004; OCHMO-TB-016 (precedent of locked hatches)"
    rationale: "Any response >0 is a safety event: no smoothing, no hysteresis, mandatory escalation."
    countermeasure_tags: [safety]

  - id: M-TLX
    domain: mental
    variable: tlx_weighted_0_100
    direction: high
    unit: "NASA-TLX 0-100"
    nominal_ref: 35
    thresholds: {caution: 55, warning: 70, critical: 85}
    weight: 0.6
    evidence_level: engineering_placeholder
    citation: "NASA-TLX (Hart & Staveland); NASA-STD-3001 V2 §5007"
    rationale: "The TLX has no normative cutoff; it is used to detect overload."
    countermeasure_tags: [workload, stress, fatigue]

  - id: M-BEDFORD
    domain: mental
    variable: bedford_workload_1_10
    direction: high
    unit: "Bedford 1-10"
    nominal_ref: 3
    thresholds: {caution: 4, warning: 7, critical: 9}
    weight: 0.5
    confirm_up: 1
    evidence_level: standard_numeric
    citation: "NASA-STD-3001 V2 §5007 (Bedford ≤3 nominal and ≤6 non-nominal)"
    rationale: "4-6 violates the requirement in nominal tasks; 7-9 exceeds the non-nominal limit."
    countermeasure_tags: [workload, stress]

  - id: M-SLEEP
    domain: mental
    variable: sleep_hours
    direction: low
    unit: "h/night"
    nominal_ref: 7.5
    thresholds: {caution: 6.0, warning: 5.0, critical: 4.0}
    weight: 0.9
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §6001, V2 §7070; Barger 2014a; Jones 2022a"
    rationale: "ISS crew sleep ~6-6.5 h despite 8.5 h scheduled; <6 h degrades vigilance and raises stress."
    countermeasure_tags: [sleep, fatigue, noise, rest]

  - id: M-COGNITION
    domain: mental
    variable: cognitive_z
    direction: low
    unit: "z vs. baseline"
    nominal_ref: 0
    thresholds: {caution: -1.0, warning: -1.5, critical: -2.5}
    weight: 0.9
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §4011; Dev 2024 (z ≤ -1.5 vs. preflight baseline)"
    rationale: "Comparison against preflight baseline, not against the population."
    countermeasure_tags: [cognition, fatigue, sleep, rest, environment_air]

  - id: M-PPC-GAP
    domain: mental
    variable: days_since_ppc
    direction: high
    unit: "days"
    nominal_ref: 7
    thresholds: {caution: 15, warning: 21, critical: 42}
    weight: 0.4
    tau_hours: 0
    confirm_up: 1
    evidence_level: standard_qualitative
    citation: "NASA-STD-3001 V1 §6002 (scheduled PMCs) and §6004; HRP (PPC every ~2 weeks)"
    rationale: "Process rule: a PPC every 2 weeks is the main behavioral monitoring."
    countermeasure_tags: [clinician_support, social]

  # --------- NEW MENTAL RULES (reinforcement §6004 / OCHMO-TB-016) -----------
  - id: M-SOCIAL-ISOLATION
    domain: mental
    variable: social_contact_days
    direction: high
    unit: "days without meaningful contact"
    nominal_ref: 1
    thresholds: {caution: 3, warning: 5, critical: 7}
    weight: 0.7
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §6004 (psychological support); OCHMO-TB-016 (isolation/confinement); Stuster 2016"
    rationale: "Prolonged isolation is a documented behavioral risk factor in analogs and the ISS; counted from the last meaningful contact (family, friend or PPC)."
    countermeasure_tags: [social, mood, stress, clinician_support]

  - id: M-ANGER-IRRITABILITY
    domain: mental
    variable: irritability_vas
    direction: high
    unit: "VAS 0-10"
    nominal_ref: 1
    thresholds: {caution: 4, warning: 6, critical: 8}
    weight: 0.6
    evidence_level: clinical_framework
    citation: "OCHMO-TB-016 (interpersonal crew-ground conflict); NASA-STD-3001 V1 §6004; Kanas 1991"
    rationale: "Irritability and interpersonal conflict are predictors of crew dysfunction on long missions (Shuttle-Mir, Mars-500)."
    countermeasure_tags: [mood, stress, social, rest]

  - id: M-MOTIVATION
    domain: mental
    variable: motivation_vas
    direction: low
    unit: "VAS 0-10"
    nominal_ref: 8
    thresholds: {caution: 5, warning: 3, critical: 1}
    weight: 0.6
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §6004; HRP Evidence Report (demoralization, third quarter); Stuster 2016"
    rationale: "The drop in motivation marks the 'third-quarter phenomenon' and precedes depressive symptoms."
    countermeasure_tags: [mood, workload, social, rest]

  - id: M-APPETITE
    domain: mental
    variable: appetite_vas
    direction: low
    unit: "VAS 0-10"
    nominal_ref: 7
    thresholds: {caution: 4, warning: 2, critical: 1}
    weight: 0.5
    evidence_level: clinical_framework
    citation: "NASA-STD-3001 V1 §3004/§6004; V2 §7000 (nutrition); HRP"
    rationale: "Loss of appetite is a somatic symptom of depression/stress and a predictor of insufficient caloric intake in flight."
    countermeasure_tags: [mood, sleep, clinician]

countermeasures:
  - {id: CM-EXERCISE-INTERVAL, label: "Guided interval aerobic exercise", tags: [stress, mood, anxiety, sleep, fatigue, cognition], effort: media, requires_clinician: false,
     benefits: "Reduces subclinical mood/anxiety symptoms and stabilizes mood; improves BDNF.",
     harms_limits: "Consumes schedule time; musculoskeletal risk.",
     evidence: "Abeln 2015; Salmon 2001; Samendinger 2019"}
  - {id: CM-SLEEP-DLS, label: "Protected sleep window + dynamic lighting", tags: [sleep, fatigue, cognition, mood], effort: baja, requires_clinician: false,
     benefits: "Improves circadian entrainment and reduces attention lapses.",
     harms_limits: "Requires schedule changes; does not fix ambient noise.",
     evidence: "Grant 2024; Rahman 2022; V2 §8055"}
  - {id: CM-QUIET-SLEEP, label: "Reduce noise: earplugs, pause equipment, relocate tasks", tags: [noise, sleep], effort: baja, requires_clinician: false,
     benefits: "Addresses a direct cause of short sleep; meets V2 §6079/§6082.",
     harms_limits: "Earplugs do not replace the normative limit.",
     evidence: "NASA-STD-3001 V2 §6079/§6082; Caddick 2018"}
  - {id: CM-REST-RECOVERY, label: "Protected rest (light shift / controlled nap)", tags: [rest, fatigue, cognition, vitals], effort: baja, requires_clinician: false,
     benefits: "Restores vigilance and lowers physiological load in the short term.",
     harms_limits: "Gives up work time; misuse can misalign circadian rhythm.",
     evidence: "NASA-STD-3001 V1 §6001; Lim & Dinges 2010"}
  - {id: CM-WORKLOAD-REBALANCE, label: "Rebalance workload and give autonomy over schedule", tags: [workload, stress, fatigue], effort: media, requires_clinician: false,
     benefits: "Autonomy and meaningful work protect against monotony and overload.",
     harms_limits: "Requires crew agreement; may delay tasks.",
     evidence: "Kanas & Manzey 2008; Stuster 2016; V2 §5007"}
  - {id: CM-CBT-AUTONOMO, label: "Autonomous CBT / problem-solving modules (VSS, This Way Up)", tags: [mood, anxiety, stress], effort: media, requires_clinician: false,
     benefits: "Works without real-time communication; PST reduced mild depression in 3 sessions.",
     harms_limits: "Mixed acceptability in analog (HI-SEAS); does not replace clinical evaluation if symptoms worsen.",
     evidence: "Sandoval 2017; Rose 2018; Anderson 2016"}
  - {id: CM-SMART-OP, label: "SMART-OP stress management training", tags: [stress, anxiety], effort: media, requires_clinician: false,
     benefits: "Reduces perceived stress and increases sense of control.",
     harms_limits: "Modest effect; requires structured time.",
     evidence: "Rose 2013; Rose 2019"}
  - {id: CM-MINDFULNESS, label: "Mindfulness (short guided sessions)", tags: [stress, anxiety, mood], effort: baja, requires_clinician: false,
     benefits: "Effective for stress and moderately for anxiety and mood.",
     harms_limits: "Small effect on burnout.",
     evidence: "Khoury 2015; Pagnini 2024"}
  - {id: CM-CROPS-NATURE, label: "Crop care / virtual nature window", tags: [mood, stress, social], effort: baja, requires_clinician: false,
     benefits: "Meaningful activity and connection with Earth.",
     harms_limits: "If the crop fails it can be counterproductive.",
     evidence: "Kelly 2017; Veggie; Kearney 2013"}
  - {id: CM-SOCIAL-MEAL, label: "Crew meal or social event", tags: [mood, social, stress], effort: baja, requires_clinician: false,
     benefits: "Shared meals are the most cited cohesion mechanism on the ISS.",
     harms_limits: "May be undesirable if the conflict is interpersonal.",
     evidence: "Stuster 2016; Douglas 2016"}
  - {id: CM-ASYNC-FAMILY, label: "Asynchronous message/video with family", tags: [mood, social, stress, clinician_support], effort: baja, requires_clinician: false,
     benefits: "Maintains the bond despite the delay; reduces evening stress.",
     harms_limits: "Not real-time; difficult news can increase distress.",
     evidence: "Bell 2025; Ott 2016 (ANSIBLE); V2 §10093"}
  - {id: CM-VITALS-RECHECK, label: "Repeat measurement and check sensor", tags: [vitals], effort: baja, requires_clinician: false,
     benefits: "Rules out artifact before escalating.",
     harms_limits: "Delays 5-10 min; not applicable if symptoms are present.",
     evidence: "NASA-STD-3001 V1 §3003"}
  - {id: CM-ENV-AIR, label: "Environmental action: ventilation, module change, CO2 purge", tags: [environment_air, vitals, cognition], effort: media, requires_clinician: false,
     benefits: "Fixes the cause, not just the symptom.",
     harms_limits: "May interrupt tasks; requires an approved procedure.",
     evidence: "NASA-STD-3001 V2 §6017/§6022"}
  - {id: CM-RAD-SHELTER, label: "Radiation shelter / reschedule EVA (ALARA)", tags: [radiation], effort: media, requires_clinician: false,
     benefits: "Reduces cumulative dose to the CNS.",
     harms_limits: "Affects EVA; additional confinement worsens isolation.",
     evidence: "NASA-STD-3001 V2 §6097/§6099"}
  - {id: CM-PPC-ASYNC, label: "Asynchronous PPC with ground psychologist/psychiatrist", tags: [mood, anxiety, stress, clinician_support, clinician, safety], effort: media, requires_clinician: true,
     benefits: "Expert evaluation and confidential space; primary behavioral monitoring on the ISS.",
     harms_limits: "Communication delay; fear for flight status inhibits candor.",
     evidence: "NASA-STD-3001 V1 §6002/§6004; HRP"}
  - {id: CM-PMC-CMO, label: "Private medical consultation (PMC) with CMO / flight surgeon", tags: [vitals, radiation, clinician, safety], effort: media, requires_clinician: true,
     benefits: "Differential diagnosis and access to the medical kit/protocol.",
     harms_limits: "Occupies CMO time; may require asynchronous support.",
     evidence: "NASA-STD-3001 V1 §3004/§6002"}
  - {id: CM-PHARMA, label: "Pharmacotherapy (only with clinical authorization)", tags: [anxiety, mood, sleep, clinician], effort: baja, requires_clinician: true,
     benefits: "Symptomatic relief when behavioral measures are not enough.",
     harms_limits: "62.9 % of ISS drugs may reduce alertness; hypnotics limit response to alarms.",
     evidence: "Roma 2021; Friedman & Bui 2017; Wotring 2015"}
  - {id: CM-SAFETY-PROTOCOL, label: "Safety protocol: accompaniment + urgent clinical contact", tags: [safety], effort: alta, requires_clinician: true,
     benefits: "Protects the person and the crew while the evaluation takes place.",
     harms_limits: "High operational burden; respectful handling so as not to increase isolation.",
     evidence: "NASA-STD-3001 V1 §6004; OCHMO-TB-016"}

share:
  follow_up_hours: {CAUTION: 48, WARNING: 24, CRITICAL: 6}
  min_improvement: 0.10
  prompts:
    seek:
      - "Summarize the problem in plain language and cite which rule was triggered."
      - "Explain that options exist and that their participation matters; they may decide not to participate or to delegate."
      - "Offer to include a crewmate or family support if they wish."
    help:
      - "Compare the benefits and harms of each option, including active observation."
      - "Express numbers simply and explain what is known and what is not."
      - "Check understanding: ask them to explain the options in their own words (teach-back)."
    assess:
      - "Ask what matters most to them right now and acknowledge those values."
    reach:
      - "Ask whether they are ready to decide or need more time or information."
      - "Confirm the decision and schedule follow-up; delegating the decision is also valid."
    evaluate:
      - "At follow-up compare the state with the baseline; if it has not improved, review the options again."
  assess_questions:
    - "What matters most to you today: sleep, privacy, contact with family, performance on critical tasks?"
    - "What has helped before in similar situations, and what has not?"
    - "What side effects or schedule costs are you not willing to accept?"